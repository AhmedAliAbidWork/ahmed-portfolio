<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0D0911"/>
  <defs>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="600" cy="337" r="420" fill="url(#pinkGlow)"/>

  <g transform="translate(120, 75)">
    <rect width="960" height="525" rx="16" fill="#15101A" stroke="rgba(236,72,153,0.3)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="960" height="46" rx="16" fill="#0F0B13"/>
    <circle cx="24" cy="23" r="5.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="42" cy="23" r="5.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="60" cy="23" r="5.5" fill="#10B981" fill-opacity="0.8"/>
    <text x="480" y="28" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">haikuists.app • Event Organizer &amp; Native Video Calling</text>

    <!-- Content -->
    <g transform="translate(40, 75)">
      <!-- Left: Realtime Firestore Chat & Negotiation Flow -->
      <rect width="430" height="410" rx="14" fill="#100C15" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="35" fill="#F472B6" font-family="system-ui, sans-serif" font-size="14" font-weight="700">REALTIME MESSAGING &amp; CONTRACTS</text>

      <!-- Chat Bubble 1 -->
      <g transform="translate(25, 55)">
        <rect width="280" height="65" rx="12" fill="#201526" stroke="rgba(255,255,255,0.06)"/>
        <text x="15" y="24" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">"Event booked for Saturday 8PM. Poet line-up finalized."</text>
        <text x="15" y="48" fill="#94A3B8" font-family="monospace" font-size="10">Delivered via Firestore snapshot listener</text>
      </g>

      <!-- Chat Bubble 2 (Poet) -->
      <g transform="translate(125, 135)">
        <rect width="280" height="65" rx="12" fill="#EC4899" fill-opacity="0.25" stroke="rgba(236,72,153,0.4)"/>
        <text x="15" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12">"Contract terms accepted. Ready for pre-event sync."</text>
        <text x="15" y="48" fill="#FBCFE8" font-family="monospace" font-size="10">Status: Signed • Escrow locked</text>
      </g>

      <!-- Pipeline Stage -->
      <g transform="translate(25, 220)">
        <rect width="380" height="165" rx="10" fill="#1A1220" stroke="rgba(255,255,255,0.06)"/>
        <text x="20" y="30" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EVENT PIPELINE MILESTONES</text>
        
        <rect x="20" y="48" width="340" height="28" rx="6" fill="#2A1B33"/>
        <text x="35" y="66" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✔ Inquiry &amp; Availability Check</text>

        <rect x="20" y="84" width="340" height="28" rx="6" fill="#2A1B33"/>
        <text x="35" y="102" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✔ Realtime Negotiation &amp; Deposit</text>

        <rect x="20" y="120" width="340" height="28" rx="6" fill="#EC4899" fill-opacity="0.3" stroke="rgba(236,72,153,0.5)"/>
        <text x="35" y="138" fill="#FDF2F8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">▶ Live In-App Video Call</text>
      </g>
    </g>

    <!-- Right: Native In-App Video Calling -->
    <g transform="translate(495, 75)">
      <rect width="425" height="410" rx="14" fill="#100C15" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="35" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">LOW-LATENCY NATIVE VIDEO CALLING</text>

      <!-- Video Call Grid -->
      <g transform="translate(25, 55)">
        <!-- Video screen 1 -->
        <rect width="180" height="230" rx="12" fill="#1E1428" stroke="rgba(255,255,255,0.1)"/>
        <circle cx="90" cy="100" r="36" fill="#EC4899" fill-opacity="0.3"/>
        <text x="90" y="107" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Host</text>
        <rect x="15" y="195" width="100" height="20" rx="4" fill="rgba(0,0,0,0.6)"/>
        <text x="65" y="209" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Sarah (Organizer)</text>

        <!-- Video screen 2 -->
        <rect x="195" y="0" width="180" height="230" rx="12" fill="#161222" stroke="rgba(6,182,212,0.3)"/>
        <circle cx="285" cy="100" r="36" fill="#06B6D4" fill-opacity="0.3"/>
        <text x="285" y="107" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Poet</text>
        <rect x="210" y="195" width="100" height="20" rx="4" fill="rgba(0,0,0,0.6)"/>
        <text x="260" y="209" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">David (Performer)</text>
      </g>

      <!-- Architecture Card -->
      <rect x="25" y="305" width="375" height="85" rx="10" fill="#1A1220" stroke="rgba(255,255,255,0.06)"/>
      <text x="45" y="335" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Zero External UI Dependencies</text>
      <text x="45" y="358" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Firebase Cloud Functions orchestrate WebRTC room negotiation, token dispensing, and native video sessions.</text>
    </g>
  </g>
</svg>
