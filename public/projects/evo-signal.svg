<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#080B14"/>
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="900" cy="200" r="350" fill="url(#cyanGlow)"/>

  <!-- Window Container -->
  <g transform="translate(120, 75)">
    <rect width="960" height="525" rx="16" fill="#0F1322" stroke="rgba(6,182,212,0.25)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="960" height="46" rx="16" fill="#0B0E1A"/>
    <circle cx="24" cy="23" r="5.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="42" cy="23" r="5.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="60" cy="23" r="5.5" fill="#10B981" fill-opacity="0.8"/>
    <text x="480" y="28" fill="#64748B" font-family="monospace" font-size="12" text-anchor="middle">evo-signal.trade/live-feed (Firebase Synchronized)</text>

    <!-- Content Row -->
    <g transform="translate(40, 75)">
      <!-- Left: Mobile Device Mockup representing Flutter Mobile App -->
      <rect width="260" height="410" rx="24" fill="#080A12" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
      <rect x="75" y="12" width="110" height="18" rx="9" fill="#141826"/>
      
      <!-- App Screen Content -->
      <text x="30" y="60" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">EVO SIGNAL PRO</text>
      <text x="30" y="85" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800">BTC/USDT</text>
      <text x="135" y="85" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="700">+6.84% ▲</text>

      <!-- Mini Chart -->
      <path d="M 30 180 Q 70 150, 110 165 T 180 120 T 230 135 L 230 190 L 30 190 Z" fill="url(#chartGrad)"/>
      <path d="M 30 180 Q 70 150, 110 165 T 180 120 T 230 135" stroke="#10B981" stroke-width="2.5" fill="none"/>

      <!-- Signal Card inside phone -->
      <rect x="25" y="215" width="210" height="75" rx="12" fill="#121728" stroke="rgba(16,185,129,0.3)"/>
      <circle cx="45" cy="245" r="10" fill="#10B981" fill-opacity="0.2"/>
      <text x="65" y="242" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LONG SIGNAL: ETH</text>
      <text x="65" y="260" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Target: $3,450 • Stop: $3,180</text>
      <text x="65" y="278" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Sync: 18ms (Firebase)</text>

      <rect x="25" y="305" width="210" height="75" rx="12" fill="#121728" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="45" cy="335" r="10" fill="#06B6D4" fill-opacity="0.2"/>
      <text x="65" y="332" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SOL BREAKOUT</text>
      <text x="65" y="350" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Target: $165 • Brevo Alert Sent</text>
    </g>

    <!-- Right: Telemetry & Architecture Panel -->
    <g transform="translate(340, 75)">
      <!-- Top Metrics Banner -->
      <rect width="580" height="110" rx="14" fill="#0A0D18" stroke="rgba(255,255,255,0.06)"/>
      
      <g transform="translate(25, 25)">
        <text x="0" y="15" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACTIVE CONCURRENT USERS</text>
        <text x="0" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="32" font-weight="800">15,000+</text>
      </g>

      <g transform="translate(220, 25)">
        <text x="0" y="15" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FIREBASE REAL-TIME LATENCY</text>
        <text x="0" y="55" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="32" font-weight="800">&lt; 45ms</text>
      </g>

      <g transform="translate(420, 25)">
        <text x="0" y="15" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="600">NOTIFICATION DISPATCH</text>
        <text x="0" y="55" fill="#10B981" font-family="system-ui, sans-serif" font-size="32" font-weight="800">Brevo API</text>
      </g>

      <!-- Architecture Flow Diagram Card -->
      <g transform="translate(0, 130)">
        <rect width="580" height="280" rx="14" fill="#0A0D18" stroke="rgba(255,255,255,0.06)"/>
        <text x="25" y="35" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Scalable Mobile &amp; Cloud Architecture</text>
        
        <!-- Node 1: Mobile UI -->
        <rect x="25" y="60" width="150" height="85" rx="8" fill="#14192B" stroke="#06B6D4"/>
        <text x="100" y="95" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Flutter / Dart</text>
        <text x="100" y="115" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Cross-Platform App</text>

        <!-- Arrow 1 -->
        <path d="M 180 102 L 220 102" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Node 2: Firebase Realtime -->
        <rect x="225" y="60" width="160" height="85" rx="8" fill="#14192B" stroke="#F59E0B"/>
        <text x="305" y="95" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Firebase Firestore</text>
        <text x="305" y="115" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Live Stream Listeners</text>

        <!-- Node 3: Cloud Functions & Encryption -->
        <rect x="400" y="60" width="155" height="85" rx="8" fill="#14192B" stroke="#10B981"/>
        <text x="477" y="95" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Cloud Functions</text>
        <text x="477" y="115" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Data Encryption &amp; Auth</text>

        <!-- Security Badge -->
        <rect x="25" y="170" width="530" height="85" rx="8" fill="#111624" stroke="rgba(255,255,255,0.06)"/>
        <text x="45" y="202" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Enterprise Security &amp; Credential Protection</text>
        <text x="45" y="225" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Automated Brevo webhooks, end-to-end encrypted financial signals, and zero-leakage token storage.</text>
      </g>
    </g>
  </g>
</svg>
