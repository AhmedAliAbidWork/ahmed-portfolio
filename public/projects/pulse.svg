<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#090B12"/>
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0E121B" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Glow -->
  <circle cx="950" cy="180" r="280" fill="#06B6D4" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="250" cy="480" r="240" fill="#3B82F6" fill-opacity="0.08" filter="blur(80px)"/>

  <!-- Window Chrome Frame -->
  <g transform="translate(100, 70)">
    <rect width="1000" height="535" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="1000" height="48" rx="16" fill="#11141E"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444" fill-opacity="0.7"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B" fill-opacity="0.7"/>
    <circle cx="68" cy="24" r="6" fill="#10B981" fill-opacity="0.7"/>
    <text x="500" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">pulse.analytics.io/live-streams</text>

    <!-- Sidebar mock -->
    <rect x="24" y="70" width="180" height="440" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
    <rect x="44" y="94" width="90" height="12" rx="4" fill="#06B6D4" fill-opacity="0.8"/>
    <rect x="44" y="126" width="140" height="10" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="44" y="152" width="120" height="10" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="44" y="178" width="135" height="10" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="44" y="204" width="105" height="10" rx="3" fill="rgba(255,255,255,0.1)"/>

    <!-- Stat cards inside dashboard -->
    <g transform="translate(228, 70)">
      <rect width="230" height="100" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="36" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACTIVE INGESTION</text>
      <text x="20" y="70" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="700">1.84M</text>
      <text x="120" y="70" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">▲ +18.4%</text>
    </g>

    <g transform="translate(480, 70)">
      <rect width="230" height="100" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="36" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AVG QUERY LATENCY</text>
      <text x="20" y="70" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="28" font-weight="700">32ms</text>
      <text x="105" y="70" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">▼ -42%</text>
    </g>

    <g transform="translate(732, 70)">
      <rect width="230" height="100" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="36" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NODES HEALTH</text>
      <text x="20" y="70" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="700">99.98%</text>
      <text x="145" y="70" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">HEALTHY</text>
    </g>

    <!-- Main Chart -->
    <g transform="translate(228, 190)">
      <rect width="734" height="320" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
      <text x="24" y="38" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Live Throughput (ops/sec)</text>
      
      <!-- Chart Area -->
      <path d="M 30 250 Q 120 200, 200 220 T 380 140 T 520 170 T 680 80 L 680 270 L 30 270 Z" fill="url(#cyanGrad)" fill-opacity="0.12"/>
      <path d="M 30 250 Q 120 200, 200 220 T 380 140 T 520 170 T 680 80" fill="none" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="680" cy="80" r="6" fill="#06B6D4"/>
      <circle cx="680" cy="80" r="12" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="2"/>
    </g>
  </g>
</svg>
