<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0A0914"/>
  <defs>
    <radialGradient id="indigoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="600" cy="337" r="420" fill="url(#indigoGlow)"/>

  <g transform="translate(120, 75)">
    <rect width="960" height="525" rx="16" fill="#111124" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="960" height="46" rx="16" fill="#0D0D1D"/>
    <circle cx="24" cy="23" r="5.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="42" cy="23" r="5.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="60" cy="23" r="5.5" fill="#10B981" fill-opacity="0.8"/>
    <text x="480" y="28" fill="#64748B" font-family="monospace" font-size="12" text-anchor="middle">engaged.community/dashboard • Supabase Multi-Tenant RBAC</text>

    <!-- Content -->
    <g transform="translate(40, 75)">
      <!-- Left: Multi-Tenant Architecture Structure -->
      <rect width="420" height="410" rx="14" fill="#0D0D1F" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="35" fill="#818CF8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">MULTI-TENANT ISOLATION MODEL</text>
      
      <!-- Tenant 1 -->
      <g transform="translate(25, 55)">
        <rect width="370" height="95" rx="10" fill="#171732" stroke="rgba(99,102,241,0.4)"/>
        <text x="20" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tenant: Metro Health Network</text>
        <text x="20" y="52" fill="#94A3B8" font-family="monospace" font-size="11">Schema: tenant_01_secure • 4,200 members</text>
        <rect x="20" y="65" width="110" height="18" rx="4" fill="#6366F1" fill-opacity="0.3"/>
        <text x="75" y="78" fill="#C7D2FE" font-family="monospace" font-size="10" text-anchor="middle">ROLE: ADMIN</text>
      </g>

      <!-- Tenant 2 -->
      <g transform="translate(25, 165)">
        <rect width="370" height="95" rx="10" fill="#171732" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Tenant: EduBridge Foundation</text>
        <text x="20" y="52" fill="#94A3B8" font-family="monospace" font-size="11">Schema: tenant_02_secure • 1,850 members</text>
        <rect x="20" y="65" width="130" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
        <text x="85" y="78" fill="#A7F3D0" font-family="monospace" font-size="10" text-anchor="middle">ROLE: MODERATOR</text>
      </g>

      <!-- Security Guarantee -->
      <rect x="25" y="275" width="370" height="110" rx="10" fill="#12122A" stroke="rgba(255,255,255,0.06)"/>
      <text x="20" y="30" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ROW-LEVEL SECURITY (RLS)</text>
      <text x="20" y="55" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" leading-relaxed">PostgreSQL RLS policies strictly enforce cross-tenant data partitioning. Serverless Edge Functions handle authenticated mutations.</text>
    </g>

    <!-- Right: Supabase APIs & Edge Functions -->
    <g transform="translate(485, 75)">
      <rect width="435" height="410" rx="14" fill="#0D0D1F" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="35" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">EDGE FUNCTIONS &amp; API PIPELINE</text>

      <!-- Code block preview -->
      <g transform="translate(25, 55)">
        <rect width="385" height="210" rx="10" fill="#070712" stroke="rgba(255,255,255,0.08)"/>
        <text x="20" y="32" fill="#6366F1" font-family="monospace" font-size="12">// Supabase Deno Edge Function</text>
        <text x="20" y="58" fill="#94A3B8" font-family="monospace" font-size="12">Deno.serve(async (req) =&gt; &#123;</text>
        <text x="35" y="84" fill="#06B6D4" font-family="monospace" font-size="12">const { tenantId, role } = await verifyAuth(req);</text>
        <text x="35" y="110" fill="#F8FAFC" font-family="monospace" font-size="12">if (!canAccessResource(role, 'community.events')) &#123;</text>
        <text x="50" y="136" fill="#EF4444" font-family="monospace" font-size="12">return new Response('Forbidden', { status: 403 });</text>
        <text x="35" y="162" fill="#F8FAFC" font-family="monospace" font-size="12">&#125;</text>
        <text x="35" y="188" fill="#10B981" font-family="monospace" font-size="12">return await fetchTenantRecords(tenantId);</text>
      </g>

      <!-- Badges -->
      <div transform="translate(25, 290)">
        <rect x="25" y="285" width="385" height="95" rx="10" fill="#141432" stroke="rgba(99,102,241,0.2)"/>
        <text x="45" y="315" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Scalable Serverless Infrastructure</text>
        <text x="45" y="338" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Supabase Auth, PostgreSQL custom functions, and FlutterFlow custom action bindings.</text>
      </div>
    </g>
  </g>
</svg>
