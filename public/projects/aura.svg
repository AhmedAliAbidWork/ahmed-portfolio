<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0A0B10"/>
  <defs>
    <radialGradient id="roseGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="600" cy="337" r="420" fill="url(#roseGoldGlow)"/>

  <g transform="translate(130, 80)">
    <!-- Storefront Showcase Window -->
    <rect width="940" height="515" rx="16" fill="#12131A" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Navigation header of the storefront -->
    <rect width="940" height="52" rx="16" fill="#0E0F15"/>
    <text x="40" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="2">AURA STUDIO</text>
    <text x="400" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">COLLECTION</text>
    <text x="520" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">EDITORIAL</text>
    <text x="630" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">ABOUT</text>
    <rect x="830" y="16" width="70" height="24" rx="12" fill="rgba(244,63,94,0.15)" stroke="rgba(244,63,94,0.3)"/>
    <text x="865" y="32" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BAG (2)</text>

    <!-- Editorial Product Hero Card -->
    <g transform="translate(40, 75)">
      <!-- Left side: Editorial visual block -->
      <rect width="440" height="395" rx="12" fill="#1A1C24" stroke="rgba(255,255,255,0.05)"/>
      <circle cx="220" cy="180" r="90" fill="#F43F5E" fill-opacity="0.25"/>
      <rect x="160" y="110" width="120" height="150" rx="20" fill="#242834" stroke="rgba(255,255,255,0.15)"/>
      <text x="220" y="320" fill="#F8FAFC" font-family="serif" font-size="22" font-style="italic" text-anchor="middle">Series IX Chronometer</text>
      <text x="220" y="345" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Titanium Grade 5 • Sapphire Crystal</text>
    </g>

    <!-- Right side: Performance & Cart mutation telemetry -->
    <g transform="translate(510, 75)">
      <rect width="390" height="185" rx="12" fill="#161822" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="35" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LIGHTHOUSE PERFORMANCE SCORE</text>
      <circle cx="70" cy="115" r="45" stroke="#10B981" stroke-width="6" fill="transparent"/>
      <text x="70" y="122" fill="#10B981" font-family="system-ui, sans-serif" font-size="26" font-weight="800" text-anchor="middle">100</text>
      
      <text x="140" y="85" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">First Contentful Paint</text>
      <text x="140" y="105" fill="#94A3B8" font-family="monospace" font-size="13">0.3s (Edge Cached)</text>
      <text x="140" y="130" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Cumulative Layout Shift</text>
      <text x="140" y="150" fill="#94A3B8" font-family="monospace" font-size="13">0.000 (Zero Jitter)</text>
    </g>

    <g transform="translate(510, 280)">
      <rect width="390" height="190" rx="12" fill="#161822" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="35" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INSTANT OPTIMISTIC CHECKOUT</text>
      <text x="24" y="65" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">Stripe Elements with zero-redirect payment flows and automated currency routing across 140+ countries.</text>
      
      <rect x="24" y="115" width="342" height="46" rx="8" fill="#F43F5E"/>
      <text x="195" y="143" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Purchase • $480.00 USD</text>
    </g>
