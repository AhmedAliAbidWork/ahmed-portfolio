<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#080C11"/>
  <defs>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="600" cy="337" r="420" fill="url(#greenGlow)"/>

  <!-- Main Container -->
  <g transform="translate(120, 75)">
    <rect width="960" height="525" rx="16" fill="#0F161B" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="960" height="46" rx="16" fill="#091014"/>
    <circle cx="24" cy="23" r="5.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="42" cy="23" r="5.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="60" cy="23" r="5.5" fill="#10B981" fill-opacity="0.8"/>
    <text x="480" y="28" fill="#64748B" font-family="monospace" font-size="12" text-anchor="middle">hosar-safety.app • Emergency Live Location Sharing</text>

    <!-- Map & GPS Simulation Visual -->
    <g transform="translate(40, 75)">
      <!-- Left Map Screen -->
      <rect width="520" height="410" rx="14" fill="#0A1116" stroke="rgba(255,255,255,0.06)"/>
      
      <!-- Simulated topographic lines -->
      <path d="M 40 320 Q 180 200, 320 280 T 500 180" stroke="rgba(16,185,129,0.2)" stroke-width="2" fill="none"/>
      <path d="M 20 240 Q 140 140, 280 210 T 480 120" stroke="rgba(16,185,129,0.15)" stroke-width="2" fill="none"/>
      <path d="M 60 160 Q 220 80, 360 150 T 520 60" stroke="rgba(16,185,129,0.1)" stroke-width="2" fill="none"/>

      <!-- Live GPS Marker -->
      <circle cx="280" cy="210" r="32" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="280" cy="210" r="14" fill="#10B981" fill-opacity="0.4"/>
      <circle cx="280" cy="210" r="6" fill="#10B981"/>
      <circle cx="390" cy="140" r="5" fill="#06B6D4"/>
      <circle cx="160" cy="260" r="5" fill="#06B6D4"/>

      <!-- Location Card overlay -->
      <rect x="30" y="30" width="280" height="90" rx="10" fill="#111B22" stroke="rgba(16,185,129,0.4)"/>
      <text x="45" y="55" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">● LIVE OUTDOOR GPS ACTIVE</text>
      <text x="45" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">32.4945° N, 74.5229° E</text>
      <text x="45" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Accuracy: 2.1m • Battery: 88%</text>
    </g>

    <!-- Right: Twilio SMS Alerts & Permission Engine -->
    <g transform="translate(580, 75)">
      <!-- Card 1: Twilio SMS Dispatch -->
      <rect width="340" height="195" rx="14" fill="#0A1116" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="35" fill="#EF4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AUTOMATED SOS SMS DISPATCH</text>
      
      <rect x="25" y="55" width="290" height="115" rx="10" fill="#131C24" stroke="rgba(239,68,68,0.3)"/>
      <text x="40" y="80" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="700">TWILIO SMS GATEWAY</text>
      <text x="40" y="102" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">"EMERGENCY: Member triggered SOS at 32.4945° N, 74.5229° E. Tap to track live."</text>
      <text x="40" y="145" fill="#10B981" font-family="monospace" font-size="10">Delivered to 3 contacts in 1.4s</text>

      <!-- Card 2: Permission System -->
      <rect y="215" width="340" height="195" rx="14" fill="#0A1116" stroke="rgba(255,255,255,0.06)"/>
      <text x="25" y="245" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DYNAMIC PERMISSION ARCHITECTURE</text>
      <text x="25" y="275" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" leading-relaxed">Multi-user real-time Firebase backend with granular access rules, emergency overriding, and battery-optimized background geofencing.</text>
      
      <rect x="25" y="340" width="130" height="32" rx="6" fill="#14212C"/>
      <text x="90" y="360" fill="#10B981" font-family="monospace" font-size="11" text-anchor="middle">Firebase DB</text>

      <rect x="170" y="340" width="140" height="32" rx="6" fill="#14212C"/>
      <text x="240" y="360" fill="#06B6D4" font-family="monospace" font-size="11" text-anchor="middle">Twilio API</text>
    </g>
  </g>
</svg>
